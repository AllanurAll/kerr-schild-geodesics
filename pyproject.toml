[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kerr-schild-geodesics"
version = "1.0.0"
description = "Symbolic derivation and fast numerical integration of Kerr-Schild geodesics"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Allanur Ansari" }
]
dependencies = [
  "numpy>=2.0",
  "numba>=0.60"
]

[project.optional-dependencies]
research = [
  "sympy>=1.13",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "jupyterlab>=4.0",
  "ipykernel>=6.0"
]
dev = [
  "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
